[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    live: calls the real LLM end to end (slow; run with TALKTABLE_LIVE_TESTS=1)
filterwarnings =
    # qdrant-client checks the server version in the background; test_vector_store
    # points it at a URL where nothing listens, on purpose.
    ignore:Failed to obtain server version:UserWarning
